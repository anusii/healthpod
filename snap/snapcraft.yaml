name: healthpod
version: 0.2.2
summary: Privacy preserving health document management and analsysis using PODs.
description: |
  HealthPod supports the collection of health related data and its
  analysis using modern AI tools. All documents are stored within a
  personal online data store (Pod) within your Data Vault on a Solid
  Server.  Collect your medical reports, doctor's notes, fitness data,
  and much more, to save to your Pod. We are adding privacy preserving
  AI tools to then analyse your own data and to allow you to interact,
  using the AI tools, with your data and learn about your health.

base: core22
grade: stable
confinement: strict

apps:
  healthpod:
    command: healthpod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home

# The `flutter_secure_storage` package (and maybe `vault_storage`) is
# used by `solidpod/solidui` to save secrets locally, if the app
# provides this option to the user to do so. Thus `libsecret-1-dev`
# and `libjsoncpp-dev` are required to build the installer and
# `libsecret-1-0` and `libjsoncpp1` to run the application. See
#
# https://github.com/juliansteenbakker/flutter_secure_storage/blob/develop/README.md
# https://pub.dev/packages/vault_storage/versions/2.2.0#platform-setup

parts:
  healthpod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - libgtk-3-dev
      - libblkid-dev
      - liblzma-dev
      - libsecret-1-dev
      - libjsoncpp-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp-dev
